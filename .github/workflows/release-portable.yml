name: Build portable Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag that should receive the portable assets
        required: true
        type: string

permissions:
  contents: write

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build portable package
        shell: pwsh
        run: ./scripts/build-portable-win.ps1 -Force

      - name: Attach package to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --title "Kindle Cards $env:RELEASE_TAG" --generate-notes
          }
          gh release upload $env:RELEASE_TAG release/kindle-cards-*-windows-x64.zip release/kindle-cards-*-windows-x64.zip.sha256 --clobber
